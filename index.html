<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тест інтерфейсу</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    h2 {
      margin-bottom: 24px;
      font-weight: 600;
    }

    /* --- Кнопки з анімацією натискання --- */
    .btn {
      background-color: #3b82f6;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: 500;
      border-radius: 8px;
      cursor: pointer;
      outline: none;
      transition: transform 0.1s ease, background-color 0.2s ease;
      user-select: none;
    }

    .btn:hover {
      background-color: #2563eb;
    }

    /* Анімація притискання */
    .btn:active {
      transform: scale(0.92);
    }

    /* --- Слайдер без відкриття фото --- */
    .slider-container {
      width: 100%;
      max-width: 450px;
      margin-top: 40px;
      text-align: center;
    }

    .slider-wrapper {
      position: relative;
      overflow: hidden;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      aspect-ratio: 16 / 9;
      background-color: #1e1e1e;
    }

    .slides {
      display: flex;
      width: 100%;
      height: 100%;
      transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .slide {
      min-width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: bold;
      color: #fff;
    }

    /* Тимчасові кольорові слайди для демонстрації замість важких фото */
    .slide-1 { background: linear-gradient(135deg, #f43f5e, #be123c); }
    .slide-2 { background: linear-gradient(135deg, #06b6d4, #0891b2); }
    .slide-3 { background: linear-gradient(135deg, #10b981, #047857); }

    .controls {
      display: flex;
      justify-content: space-between;
      margin-top: 16px;
      gap: 12px;
    }

    .controls .btn {
      flex: 1;
    }
  </style>
</head>
<body>

  <h2>Тестування нових функцій</h2>

  <!-- Кнопка для перевірки анімації натискання -->
  <button class="btn">Тестова кнопка</button>

  <!-- Слайдер для перевірки гортання без відкриття -->
  <div class="slider-container">
    <div class="slider-wrapper">
      <div class="slides" id="slides">
        <div class="slide slide-1">Фото 1</div>
        <div class="slide slide-2">Фото 2</div>
        <div class="slide slide-3">Фото 3</div>
      </div>
    </div>

    <div class="controls">
      <button class="btn" id="prevBtn">Назад</button>
      <button class="btn" id="nextBtn">Вперед</button>
    </div>
  </div>

  <script>
    const slides = document.getElementById('slides');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    
    let currentIndex = 0;
    const totalSlides = 3;

    function updateSlider() {
      slides.style.transform = `translateX(-${currentIndex * 100}%)`;
    }

    nextBtn.addEventListener('click', () => {
      currentIndex = (currentIndex + 1) % totalSlides;
      updateSlider();
    });

    prevBtn.addEventListener('click', () => {
      currentIndex = (currentIndex - 1 + totalSlides) % totalSlides;
      updateSlider();
    });
  </script>

</body>
</html>
