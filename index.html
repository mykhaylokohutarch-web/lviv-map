<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>Львів Спілкується та Смакує</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg-color: #f5f5f7; 
            --card-bg: rgba(255, 255, 255, 0.55); /* Зроблено білий фон на 30% прозорішим */
            --accent-main: #4542f4;      
            --accent-people: #4542f4; /* Змінено з червоного на ультрамарин */   
            --text-color: #1d1d1f; 
            --text-secondary: #86868b; 
            --ultramarine-gradient: linear-gradient(180deg, #706eff 0%, #4542f4 60%, #2a27c9 100%);
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -webkit-user-select: none;
            user-select: none;
        }

        #app-container {
            display: flex;
            width: 100%;
            height: 100vh;
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
            background-color: #e5e5ea;
        }

        #profile-sidebar {
            width: 92%;
            max-width: 400px;
            background-color: var(--card-bg);
            backdrop-filter: blur(25px) saturate(190%);
            -webkit-backdrop-filter: blur(25px) saturate(190%);
            height: 82vh;
            box-shadow: 0 12px 38px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            position: absolute;
            top: 50%;
            left: 50%;
            z-index: 2000;
            transform: translate3d(-50%, 150%, 0);
            will-change: transform;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-sizing: border-box;
            padding: 7px; 
            touch-action: none;
        }

        #profile-sidebar.active {
            transform: translate3d(-50%, -50%, 0);
        }

        .drag-handle {
            width: 38px;
            height: 5px;
            background: rgba(0, 0, 0, 0.15);
            border-radius: 3px;
            position: absolute;
            top: 6px;
            left: 50%;
            transform: translate3d(-50%, 0, 0);
            z-index: 15;
        }

        .profile-hero {
            position: relative;
            height: 180px; 
            width: 100%;
            background-size: cover;
            background-position: center;
            background-color: #e5e5ea;
            border-radius: 25px; 
            flex-shrink: 0;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
            cursor: pointer;
            touch-action: none;
            margin-top: 8px; /* Додано відступ зверху */
            box-sizing: border-box;
        }

        .badge {
            position: absolute;
            top: 12px;
            left: 12px;
            padding: 4px 10px;
            background: rgba(255, 255, 255, 0.95);
            color: var(--accent-main); 
            border-radius: 1
