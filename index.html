<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Львів Спілкується та Смакує</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg-color: #f5f5f7; 
            --card-bg: rgba(255, 255, 255, 0.75); 
            --accent-main: #4542f4;      
            --accent-people: #ff2d55;    
            --text-color: #1d1d1f; 
            --text-secondary: #86868b; 
            --ultramarine-gradient: linear-gradient(180deg, #706eff 0%, #4542f4 60%, #2a27c9 100%);
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        #app-container {
            display: flex;
            width: 100%;
            height: 100vh;
            position: relative;
        }

        #map {
            flex-grow: 1;
            height: 100%;
            background-color: #e5e5ea;
        }

        /* Бічна панель */
        #profile-sidebar {
            width: 90%;
            max-width: 400px;
            background-color: var(--card-bg);
            backdrop-filter: blur(30px) saturate(200%);
            -webkit-backdrop-filter: blur(30px) saturate(200%);
            height: 83vh;
            box-shadow: 0 14px 40px rgba(0, 0, 0, 0.12), 0 4px 12px rgba(0, 0, 0, 0.04);
            display: flex;
            flex-direction: column;
            position: absolute;
            top: 50%;
            left: 50%;
            z-index: 1000;
            
            /* Стан приховування */
            transform: translate(-50%, 150%);
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-sizing: border-box;
            padding: 12px; /* Повернуто чисті 12px з усіх чотирьох боків */
        }

        #profile-sidebar.active {
            transform: translate(-50%, -50%);
        }

        /* Абсолютний індикатор свайпу, винесений вгору */
        .drag-handle {
            width: 36px;
            height: 5px;
            background: rgba(0, 0, 0, 0.12);
            border-radius: 3px;
            position: absolute;
            top: -12px; /* Повністю захований над картою, фото не чіпає */
            left: 50%;
            transform: translateX(-50%);
            cursor: grab;
        }

        /* Фотографія з ідеальними рамками */
        .profile-hero {
            position: relative;
            height: 170px; 
            background-size: cover;
            background-position: center;
            background-color: #e5e5ea;
            border-radius: 20px;
            flex-shrink: 0;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        }

        .badge {
            position: absolute;
            top: 12px;
            left: 12px;
            padding: 4px 10px;
            background: rgba(255, 255, 255, 0.95);
            color: var(--accent-main); 
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
        }

        .profile-info {
            padding: 12px 4px 0 4px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            overflow: hidden;
        }

        .profile-name {
            font-size: 22px;
            margin: 0 0 2px 0;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .profile-status {
            font-size: 13px;
            margin: 0 0 12px 0;
            font-weight: 500;
        }
        .status-people { color: var(--accent-people); }
        .status-place { color: var(--accent-main); }

        .info-scroll-area {
            max-height: 85px; 
            overflow-y: auto;
            margin-bottom: 8px;
            flex-shrink: 0;
        }

        .profile-section {
            margin-bottom: 6px;
        }

        .profile-section label {
            display: block;
            color: var(--text-secondary);
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        .profile-section p {
            margin: 0;
            font-size: 13px;
            line-height: 1.35;
            color: #3a3a3c;
        }

        .promo-box {
            background: rgba(69, 66, 244, 0.06);
            border: 1px solid rgba(69, 66, 244, 0.15);
            padding: 10px;
            border-radius: 14px;
        }
        .promo-box p {
            color: var(--accent-main) !important;
            font-weight: 600;
        }

        #chat-container {
            display: none;
            flex-direction: column;
            border-top: 1px solid rgba(0,0,0,0.06);
            padding-top: 10px;
            flex-grow: 2; 
            overflow: hidden;
        }

        #chat-messages {
            flex-grow: 1;
            overflow-y: auto;
            padding: 2px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            list-style: none;
        }

        #chat-messages li {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.4;
        }

        .msg-other { background: rgba(0,0,0,0.06); color: var(--text-color); align-self: flex-start; }
        .msg-me { background: var(--accent-main); color: white; align-self: flex-end; }
        
        .msg-user-name {
            display: block;
            font-weight: 600;
            font-size: 10px;
            color: var(--text-secondary);
            margin-bottom: 2px;
        }

        .chat-input-row {
            display: flex;
            gap: 8px;
            background: rgba(0, 0, 0, 0.05);
            padding: 6px 6px 6px 14px;
            border-radius: 22px;
            flex-shrink: 0;
            align-items: center;
            margin-bottom: 4px;
        }

        .chat-input-row input {
            flex-grow: 1;
            border: none;
            background: transparent;
            font-size: 14px;
            outline: none;
            color: var(--text-color);
        }

        .chat-input-row button {
            background: var(--accent-main);
            color: white;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .action-btn {
            color: white;
            border: none;
            padding: 14px;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: auto;
            width: 100%;
            box-shadow: 0 4px 12px rgba(69, 66, 244, 0.2);
            flex-shrink: 0;
        }

        #qr-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.15);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        .qr-content {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            padding: 24px;
            border-radius: 24px;
            text-align: center;
            max-width: 240px;
        }
        .qr-content img { width: 180px; height: 180px; margin-bottom: 12px; border-radius: 16px; }
        .qr-close {
            background: rgba(0, 0, 0, 0.05); border: none; padding: 10px 20px; border-radius: 12px; cursor: pointer; font-weight: 600; width: 100%;
        }

        .custom-avatar-marker, .custom-place-marker { 
            background: none !important; 
            border: none !important; 
            box-shadow: none !important;
            filter: drop-shadow(0 5px 12px rgba(0, 0, 0, 0.25)) !important;
        }
        
        .avatar-ring {
            width: 44px; 
            height: 44px; 
            border-radius: 50%;
            border: 3px solid var(--accent-main);
            background-size: cover; 
            background-position: center;
            box-sizing: border-box;
        }
        
        .place-ring {
            width: 44px; 
            height: 44px; 
            border-radius: 50%;
            background: var(--ultramarine-gradient) !important; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            box-sizing: border-box;
        }

        .place-icon-svg {
            width: 20px;
            height: 20px;
            fill: #ffffff;
            display: block;
        }
    </style>
</head>
<body>

        <div id="profile-sidebar">

    </div>

            <button class="qr-close" onclick="closeQr()">Готово</button>
        </div>
    </div>

        let currentActiveItem = null;
        let currentChatRef = null;

        people.forEach(person => {
            const customIcon = L.divIcon({
                className: 'custom-avatar-marker',
                html: `<div class="avatar-ring" style="background-image: url('${person.photo}')"></div>`,
                iconSize: [44, 44], iconAnchor: [22, 22]
            });
            L.marker(person.coords, { icon: customIcon }).addTo(map).on('click', () => showSidebar(person));
        });

        places.forEach(place => {
            const customIcon = L.divIcon({
                className: 'custom-place-marker',
                html: `<div class="place-ring">${place.svg}</div>`,
                iconSize: [44, 44], iconAnchor: [22, 22]
            });
            L.marker(place.coords, { icon: customIcon }).addTo(map).on('click', () => showSidebar(place));
        });

        function showSidebar(item) {
            currentActiveItem = item;
            
            document.getElementById('prof-img').style.backgroundImage = `url('${item.photo}')`;
            document.getElementById('prof-name').innerText = item.name;
            document.getElementById('prof-status').innerText = `"${item.status}"`;

            const badge = document.getElementById('prof-badge');
            const statusEl = document.getElementById('prof-status');
            const btn = document.getElementById('prof-btn');
            const label1 = document.getElementById('label-1');
            const label2 = document.getElementById('label-2');
            const text1Box = document.getElementById('prof-text1-box');
            const text2Box = document.getElementById('prof-text2-box');
            const chatContainer = document.getElementById('chat-container');

            if (currentChatRef) { off(currentChatRef); document.getElementById('chat-messages').innerHTML = ''; }

            if (item.type === 'person') {
                badge.style.display = 'none';
                statusEl.className = "profile-status status-people";
                label1.innerText = "Про мене";
                label2.innerText = "Інтереси";
                
                text1Box.className = "";
                text2Box.className = "";
                document.getElementById('prof-text1').innerText = item.about;
                document.getElementById('prof-text2').innerText = item.interests;

                btn.style.display = 'none';
                chatContainer.style.display = 'flex';
                loadChat(item.id);
            } else {
                badge.style.display = 'block';
                statusEl.className = "profile-status status-place";
                label1.innerText = "Про локацію";
                label2.innerText = "🔥 Спеціальна пропозиція";
                
                text1Box.className = "";
                text2Box.className = "promo-box";
                
                document.getElementById('prof-text1').innerText = item.text1;
                document.getElementById('prof-text2').innerText = item.text2 || 'Немає деталей';

                chatContainer.style.display = 'none';
                btn.style.display = 'block';
                btn.innerText = "Отримати купон";
                btn.style.background = "var(--ultramarine-gradient)";
            }

            document.getElementById('profile-sidebar').classList.add('active');
            map.panTo([item.coords[0] - 0.0015, item.coords[1]]);
        }

        window.closeProfile = function() {
            document.getElementById('profile-sidebar').classList.remove('active');
            if (currentChatRef) off(currentChatRef);
            currentActiveItem = null;
        }

        /* Обробка свайпу вниз для закриття картки */
        const sidebar = document.getElementById('profile-sidebar');
        let startY = 0;
        let currentY = 0;

        sidebar.addEventListener('touchstart', (e) => {
            if (e.target.closest('#chat-messages') || e.target.closest('.info-scroll-area')) return;
            startY = e.touches[0].clientY;
        }, { passive: true });

        sidebar.addEventListener('touchmove', (e) => {
            if (e.target.closest('#chat-messages') || e.target.closest('.info-scroll-area')) return;
            currentY = e.touches[0].clientY;
            let diffY = currentY - startY;
            
            if (diffY > 100) {
                window.closeProfile();
            }
        }, { passive: true });


        function loadChat(chatId) {
            const messagesList = document.getElementById('chat-messages');
            messagesList.innerHTML = '';
            currentChatRef = ref(db, `chats/${chatId}`);
            
            onChildAdded(currentChatRef, (snapshot) => {
                const data = snapshot.val();
                const li = document.createElement('li');
                if (data.user === myName) {
                    li.className = 'msg-me';
                    li.innerHTML = `${data.text}`;
                } else {
                    li.className = 'msg-other';
                    li.innerHTML = `<span class="msg-user-name">${data.user}</span>${data.text}`;
                }
                messagesList.appendChild(li);
                messagesList.scrollTop = messagesList.scrollHeight;
            });
        }

        function sendMessage() {
            const input = document.getElementById('chat-msg-input');
            const text = input.value.trim();
            if (!text || !currentActiveItem) return;

            const chatRef = ref(db, `chats/${currentActiveItem.id}`);
            push(chatRef, { user: myName, text: text, timestamp: Date.now() });
            input.value = '';
        }

        document.getElementById('chat-send-btn').addEventListener('click', sendMessage);
        document.getElementById('chat-msg-input').addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

        document.getElementById('prof-btn').addEventListener('click', () => {
            if (currentActiveItem && currentActiveItem.type === 'place') {
                const qrSpace = document.getElementById('qr-code-space');
                const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=LvivMapDiscount_${currentActiveItem.id}`;
                qrSpace.innerHTML = `<img src="${qrUrl}" alt="QR код">`;
                document.getElementById('qr-modal').style.display = 'flex';
            }
        });

        window.closeQr = function() {
            document.getElementById('qr-modal').style.display = 'none';
        }
    </script>
</body>
</html>
