<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Львів Спілкується та Смакує</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg-color: #f4f4f7;
            --card-bg: #ffffff;
            --accent-people: #ff4757;
            --accent-place: #6c5ce7;
            --text-color: #2d3436;
            --text-secondary: #636e72;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
        }

        #app-container {
            display: flex;
            width: 100%;
            height: 100vh;
            position: relative;
        }

        #map {
            flex-grow: 1;
            height: 100%;
            background-color: #e5e9f0;
        }

        /* Стильний універсальний сайдбар */
        #profile-sidebar {
            width: 360px;
            background-color: var(--card-bg);
            height: 100%;
            box-shadow: -5px 0 25px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
            position: absolute;
            right: 0;
            top: 0;
            z-index: 1000;
            transform: translateX(100%);
        }

        #profile-sidebar.active {
            transform: translateX(0);
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(255,255,255,0.9);
            border: none;
            color: #2d3436;
            font-size: 24px;
            cursor: pointer;
            z-index: 10;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
        }

        .profile-hero {
            position: relative;
            height: 180px;
            background-size: cover;
            background-position: center;
        }

        .badge {
            position: absolute;
            bottom: 15px;
            right: 15px;
            padding: 5px 12px;
            background: var(--accent-place);
            color: white;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .profile-info {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            overflow-y: auto;
        }

        .profile-name {
            font-size: 22px;
            margin: 0 0 5px 0;
            font-weight: 600;
        }

        .profile-status {
            font-style: italic;
            margin: 0 0 15px 0;
            font-size: 14px;
            font-weight: 500;
        }
        .status-people { color: var(--accent-people); }
        .status-place { color: var(--accent-place); }

        .profile-section {
            margin-bottom: 15px;
        }

        .profile-section label {
            display: block;
            color: var(--text-secondary);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .profile-section p {
            margin: 0;
            font-size: 14px;
            line-height: 1.45;
            color: #4a4a4a;
        }

        /* Стилі інтегрованого чату */
        #chat-container {
            display: none;
            flex-direction: column;
            border-top: 1px solid #e2e8f0;
            padding-top: 15px;
            margin-top: 10px;
            flex-grow: 1;
            max-height: 300px;
        }

        #chat-messages {
            flex-grow: 1;
            overflow-y: auto;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            padding: 10px;
            background: #f8fafc;
            margin-bottom: 10px;
            font-size: 13px;
            list-style: none;
        }

        #chat-messages li {
            margin-bottom: 8px;
            padding: 6px 10px;
            border-radius: 4px;
            background: #fff;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .chat-input-row {
            display: flex;
            gap: 5px;
        }

        .chat-input-row input {
            flex-grow: 1;
            padding: 8px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 13px;
        }

        .chat-input-row button {
            background: var(--accent-people);
            color: white;
            border: none;
            padding: 0 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .action-btn {
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: auto;
            transition: opacity 0.2s, transform 0.1s;
        }
        
        .action-btn:active { transform: scale(0.98); }

        /* Маркери Людей */
        .custom-avatar-marker { background: none; border: none; }
        .avatar-ring {
            width: 42px; height: 42px; border-radius: 50%;
            border: 3px solid var(--accent-people);
            box-shadow: 0 3px 10px rgba(255, 71, 87, 0.5);
            background-size: cover; background-position: center;
            transition: transform 0.2s;
        }
        .avatar-ring:hover { transform: scale(1.15); }

        /* Маркери Закладів */
        .custom-place-marker { background: none; border: none; }
        .place-ring {
            width: 36px; height: 36px; border-radius: 50%;
            background-color: var(--accent-place);
            border: 2px solid white;
            box-shadow: 0 3px 10px rgba(108, 92, 231, 0.6);
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; color: white; cursor: pointer;
            transition: transform 0.2s;
        }
        .place-ring:hover { transform: scale(1.2); background-color: #5b4bc4; }
    </style>
</head>
<body>

    <div id="app-container">
        <div id="map"></div>

        <div id="profile-sidebar">
            <button class="close-btn" onclick="window.closeProfile()">&times;</button>
            <div class="profile-hero" id="prof-img">
                <span class="badge" id="prof-badge" style="display:none;">Реклама</span>
            </div>
            <div class="profile-info">
                <h2 class="profile-name" id="prof-name">Назва</h2>
                <p class="profile-status" id="prof-status">"Статус або Слоган"</p>
                
                <div class="profile-section">
                    <label id="label-1">Про себе</label>
                    <p id="prof-text1">...</p>
                </div>

                <div class="profile-section">
                    <label id="label-2">Інтереси</label>
                    <p id="prof-text2">...</p>
                </div>

                <div id="chat-container">
                    <label style="font-size: 11px; text-transform: uppercase; font-weight: bold; color: var(--text-secondary); margin-bottom: 5px;">Живий чат</label>
                    <ul id="chat-messages"></ul>
                    <div class="chat-input-row">
                        <input type="text" id="chat-msg-input" placeholder="Напишіть повідомлення..." />
                        <button id="chat-send-btn">=></button>
                    </div>
                </div>

                <button class="action-btn" id="prof-btn">Дія</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module">
        // Імпортуємо модулі Firebase прямо з CDN мережі (щоб працювало без встановлення npm)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded, off } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // ТВОЯ ОСОБИСТА КОНФІГУРАЦІЯ FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyBELuWP-2ElBYWH5R_jb-hmfnYk02a_JfY",
            authDomain: "lviv-map-chat.firebaseapp.com",
            databaseURL: "https://lviv-map-chat-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "lviv-map-chat",
            storageBucket: "lviv-map-chat.firebasestorage.app",
            messagingSenderId: "940306109194",
            appId: "1:940306109194:web:a4df7fff5350d8142a60f3"
        };

        // Ініціалізуємо додаток
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Створення карти
        const map = L.map('map', { zoomControl: false }).setView([49.8415, 24.0315], 15);
        L.control.zoom({ position: 'topleft' }).addTo(map);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '© OpenStreetMap contributors, © CARTO'
        }).addTo(map);

        // Ім'я користувача (запитується один раз при завантаженні сайту)
        let myName = localStorage.getItem('chat_username');
        if (!myName) {
            myName = prompt("Введіть ваше ім'я для спілкування в чаті:", "Гість");
            if (!myName) myName = "Анонім";
            localStorage.setItem('chat_username', myName);
        }

        // Дані користувачів
        const people = [
            { id: 'marta', type: 'person', name: "Марта, 22", coords: [49.8425, 24.0320], avatar: "https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150", photo: "https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=500", status: "П'ю матчу на Ринку, ходімо гуляти! ☕", about: "Студентка академії мистецтв. Обожнюю львівські дворики.", interests: "Мистецтво, кава, виставки" },
            { id: 'vlad', type: 'person', name: "Влад, 26", coords: [49.8445, 24.0260], avatar: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=150", photo: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=500", status: "Шукаю компанію на вечірній велозаїзд 🚴‍♂️", about: "Працюю в IT, вечорами катаю на велі або граю в настілки.", interests: "Велосипед, Стрийський парк, Настільні ігри" },
            { id: 'yulia', type: 'person', name: "Юля, 24", coords: [49.8360, 24.0145], avatar: "https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=150", photo: "https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=500", status: "Хто на какао та обговорення книг? 📚", about: "Пишу вірші, колекціоную вінілові платівки.", interests: "Література, Поезія, Вініл, Затишні кав'ярні" },
            { id: 'denys', type: 'person', name: "Денис, 28", coords: [49.8490, 24.0465], avatar: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150", photo: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=500", status: "Зустрічаю захід сонця на Високому Замку 🌅", about: "Фотограф-аматор. Шукаю цікавих людей в якості моделей.", interests: "Фотографія, Подорожі, Психологія" },
            { id: 'oleksiy', type: 'person', name: "Олексій, 23", coords: [49.8390, 24.0210], avatar: "https://images.unsplash.com/photo-1517841905240-472988babdf9?w=150", photo: "https://images.unsplash.com/photo-1517841905240-472988babdf9?w=500", status: "Хто грає у фрісбі в парку Франка? 🥏", about: "Люблю спорт та спонтанні знайомства. Сиджу на траві.", interests: "Спорт, Фрісбі, Парки, Смузі" }
        ];

        // Дані закладів
        const places = [
            { id: 'bachevski', type: 'place', name: "Ресторація Бачевських", coords: [49.8430, 24.0305], photo: "https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=500", status: "Легендарна нова галицька кухня 🥂", text1: "вул. Шевська, 8. Атмосфера львівського оранжерейного шику початку XX століття.", text2: "-20% на всі авторські коктейлі з неділі по четвер після 19:00 для користувачів додатку!", icon: "🍽️" },
            { id: 'kopalnya', type: 'place', name: "Львівська копальня кави", coords: [49.8412, 24.0326], photo: "https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?w=500", status: "Тут видобувають найкращу каву міста! ⛏️☕", text1: "пл. Ринок, 10. Завітайте у шахту, щоб спробувати знамениту «Запаяну каву».", text2: "При замовленні двох порцій «Запаяної кави» — фірмовий шоколадний трюфель у подарунок!", icon: "☕" },
            { id: 'kryivka', type: 'place', name: "Криївка", coords: [49.8410, 24.0320], photo: "https://images.unsplash.com/photo-1560624052-449f5ddf0c31?w=500", status: "«Гасло знаєте?» — таємне місце УПА 🪖", text1: "пл. Ринок, 14 (підвал). Військово-історичний сеттінг, традиційні страви.", text2: "Назвіть нашому стійковому промокод 'КАРТА' та безкоштовно отримайте вітальний частунок!", icon: "🥩" }
        ];

        let currentActiveItem = null;
        let currentChatRef = null;

        // Відображення людей
        people.forEach(person => {
            const customIcon = L.divIcon({
                className: 'custom-avatar-marker',
                html: `<div class="avatar-ring" style="background-image: url('${person.avatar}')"></div>`,
                iconSize: [42, 42], iconAnchor: [21, 21]
            });
            L.marker(person.coords, { icon: customIcon }).addTo(map).on('click', () => showSidebar(person));
        });

        // Відображення закладів
        places.forEach(place => {
            const customIcon = L.divIcon({
                className: 'custom-place-marker',
                html: `<div class="place-ring">${place.icon}</div>`,
                iconSize: [36, 36], iconAnchor: [18, 18]
            });
            L.marker(place.coords, { icon: customIcon }).addTo(map).on('click', () => showSidebar(place));
        });

        function showSidebar(item) {
            currentActiveItem = item;
            
            document.getElementById('prof-img').style.backgroundImage = `url('${item.photo}')`;
            document.getElementById('prof-name').innerText = item.name;
            document.getElementById('prof-status').innerText = `"${item.status}"`;
            document.getElementById('prof-text1').innerText = item.about || item.text1;
            document.getElementById('prof-text2').innerText = item.interests || item.text2;

            const badge = document.getElementById('prof-badge');
            const statusEl = document.getElementById('prof-status');
            const btn = document.getElementById('prof-btn');
            const label1 = document.getElementById('label-1');
            const label2 = document.getElementById('label-2');
            const chatContainer = document.getElementById('chat-container');

            // Очищення попереднього слухача чату
            if (currentChatRef) {
                off(currentChatRef);
                document.getElementById('chat-messages').innerHTML = '';
            }

            if (item.type === 'person') {
                badge.style.display = 'none';
                statusEl.className = "profile-status status-people";
                label1.innerText = "Про себе";
                label2.innerText = "Інтереси";
                
                // Ховаємо стару кнопку, показуємо вікно чату
                btn.style.display = 'none';
                chatContainer.style.display = 'flex';

                // Підключаємо кімнату чату у Firebase саме для цієї людини
                loadChat(item.id);
            } else {
                badge.style.display = 'block';
                statusEl.className = "profile-status status-place";
                label1.innerText = "Про заклад та адресу";
                label2.innerText = "🔥 Гаряча акція для вас";
                
                btn.style.display = 'block';
                btn.innerText = "Отримати знижку";
                btn.style.backgroundColor = "var(--accent-place)";
                chatContainer.style.display = 'none';
            }

            document.getElementById('profile-sidebar').classList.add('active');
            map.panTo([item.coords[0], item.coords[1] + 0.0035]);
        }

        window.closeProfile = function() {
            document.getElementById('profile-sidebar').classList.remove('active');
            if (currentChatRef) {
                off(currentChatRef);
            }
            currentActiveItem = null;
        }

        // Логіка завантаження повідомлень з бази даних Firebase
        function loadChat(chatId) {
            const messagesList = document.getElementById('chat-messages');
            messagesList.innerHTML = '';
            
            currentChatRef = ref(db, `chats/${chatId}`);
            
            onChildAdded(currentChatRef, (snapshot) => {
                const data = snapshot.val();
                const li = document.createElement('li');
                li.innerHTML = `<strong>${data.user}:</strong> ${data.text}`;
                messagesList.appendChild(li);
                messagesList.scrollTop = messagesList.scrollHeight;
            });
        }

        // Відправка повідомлення в Firebase
        function sendMessage() {
            const input = document.getElementById('chat-msg-input');
            const text = input.value.trim();
            if (!text || !currentActiveItem) return;

            const chatRef = ref(db, `chats/${currentActiveItem.id}`);
            push(chatRef, {
                user: myName,
                text: text,
                timestamp: Date.now()
            });
            input.value = '';
        }

        // Вішаємо події на кнопки чату
        document.getElementById('chat-send-btn').addEventListener('click', sendMessage);
        document.getElementById('chat-msg-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // Подія для кнопки знижок закладів
        document.getElementById('prof-btn').addEventListener('click', () => {
            if (currentActiveItem && currentActiveItem.type === 'place') {
                alert(`Ваш купон на знижку в "${currentActiveItem.name}" активовано! Покажіть цей екран офіціанту.`);
            }
        });
    </script>
</body>
</html>
