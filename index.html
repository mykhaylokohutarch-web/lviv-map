<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>Львів Спілкується та Смакує</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg-color: #f5f5f7; 
            --card-bg: rgba(255, 255, 255, 0.55); /* Зроблено білий фон на 30% прозорішим */
            --accent-main: #4542f4;      
            --accent-people: #4542f4; /* Змінено з червоного на ультрамарин */   
            --text-color: #1d1d1f; 
            --text-secondary: #86868b; 
            --ultramarine-gradient: linear-gradient(180deg, #706eff 0%, #4542f4 60%, #2a27c9 100%);
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -webkit-user-select: none;
            user-select: none;
        }

        #app-container {
            display: flex;
            width: 100%;
            height: 100vh;
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
            background-color: #e5e5ea;
        }

        /* УЛЬТРА-МІНІМАЛІСТИЧНИЙ ПОВЗУНОК ЗА ЗОЛОТИМ ПЕРЕТИНОМ */
        .apple-zoom-slider-container {
            position: absolute;
            right: 8px; /* Максимально близько до правої грані */
            top: 61.8%; /* Точне золоте перетинання ближче до нижнього краю */
            transform: translateY(-50%);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 160px;
            width: 24px; /* Вузька зона взаємодії, щоб не перекривати кліки по карті */
            touch-action: none;
        }

        .apple-zoom-track {
            position: relative;
            width: 2px; /* Тонка лінія */
            height: 140px;
            background: rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 1px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            cursor: pointer;
        }

        .apple-zoom-handle {
            position: absolute;
            width: 14px; /* Маленький кружечок */
            height: 14px;
            background: rgba(255, 255, 255, 0.85); /* Напівпрозорий білий */
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border-radius: 50%;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
            left: 50%;
            transform: translate3d(-50%, 50%, 0);
            bottom: 0%; /* Контролюється через JS */
            will-change: bottom;
            transition: background 0.2s ease, transform 0.1s ease;
        }

        .apple-zoom-track:active .apple-zoom-handle {
            background: rgba(255, 255, 255, 1);
            transform: translate3d(-50%, 50%, 0) scale(1.1);
        }

        #profile-sidebar {
            width: 92%;
            max-width: 400px;
            background-color: var(--card-bg);
            backdrop-filter: blur(25px) saturate(190%);
            -webkit-backdrop-filter: blur(25px) saturate(190%);
            height: 82vh;
            box-shadow: 0 12px 38px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            position: absolute;
            top: 50%;
            left: 50%;
            z-index: 2000;
            transform: translate3d(-50%, 150%, 0);
            will-change: transform;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-sizing: border-box;
            
            /* ВНУТРІШНІ РАМКИ КАРТКИ ЗМЕНШЕНО ВДВІЧІ (з 14px до 7px) */
            padding: 7px; 
            touch-action: none;
        }

        #profile-sidebar.active {
            transform: translate3d(-50%, -50%, 0);
        }

        .drag-handle {
            width: 38px;
            height: 5px;
            background: rgba(0, 0, 0, 0.15);
            border-radius: 3px;
            position: absolute;
            
            /* Вирівняно ручку по висоті з урахуванням нових тонких рамок */
            top: 6px;
            left: 50%;
            transform: translate3d(-50%, 0, 0);
            z-index: 15;
        }

        .profile-hero {
            position: relative;
            height: 180px; 
            width: 100%;
            background-size: cover;
            background-position: center;
            background-color: #e5e5ea;
            border-radius: 25px; /* Більш гармонійний радіус під тонку рамку */
            flex-shrink: 0;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
            cursor: pointer;
            touch-action: none;
            
            /* ТОЧНЕ ВИРІВНЮВАННЯ: Верхній відступ тепер абсолютно такий же, як і по боках (7px) */
            margin-top: 7px; 
            box-sizing: border-box;
        }

        .badge {
            position: absolute;
            top: 12px;
            left: 12px;
            padding: 4px 10px;
            background: rgba(255, 255, 255, 0.95);
            color: var(--accent-main); 
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
            z-index: 10;
        }

        .profile-info {
            /* Легкий відступ знизу фото для повітря в інтерфейсі */
            padding: 12px 7px 0 7px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            overflow: hidden;
        }

        .profile-name {
            font-size: 23px;
            margin: 0 0 2px 0;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .profile-status {
            font-size: 13px;
            margin: 0 0 12px 0;
            font-weight: 500;
        }
        .status-people { color: var(--accent-people); }
        .status-place { color: var(--accent-main); }

        .info-scroll-area {
            max-height: 90px; 
            overflow-y: auto;
            margin-bottom: 8px;
            flex-shrink: 0;
            touch-action: pan-y;
            -webkit-overflow-scrolling: touch;
        }

        .profile-section {
            margin-bottom: 6px;
        }

        .profile-section label {
            display: block;
            color: var(--text-secondary);
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        .profile-section p {
            margin: 0;
            font-size: 13px;
            line-height: 1.35;
            color: #3a3a3c;
        }

        .promo-box {
            background: rgba(69, 66, 244, 0.06);
            border: 1px solid rgba(69, 66, 244, 0.15);
            padding: 10px;
            border-radius: 14px;
        }
        .promo-box p {
            color: var(--accent-main) !important;
            font-weight: 600;
        }

        #chat-container {
            display: none;
            flex-direction: column;
            border-top: 1px solid rgba(0,0,0,0.06);
            padding-top: 10px;
            flex-grow: 2; 
            overflow: hidden;
        }

        #chat-messages {
            flex-grow: 1;
            overflow-y: auto;
            padding: 2px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            list-style: none;
            touch-action: pan-y;
            -webkit-overflow-scrolling: touch;
        }

        #chat-messages li {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.4;
        }

        .msg-other { background: rgba(0,0,0,0.06); color: var(--text-color); align-self: flex-start; }
        .msg-me { background: var(--accent-main); color: white; align-self: flex-end; }
        
        .msg-user-name {
            display: block;
            font-weight: 600;
            font-size: 10px;
            color: var(--text-secondary);
            margin-bottom: 2px;
        }

        .chat-input-row {
            display: flex;
            gap: 8px;
            background: rgba(0, 0, 0, 0.05);
            padding: 6px 6px 6px 14px;
            border-radius: 22px;
            flex-shrink: 0;
            align-items: center;
            margin-bottom: 4px;
        }

        .chat-input-row input {
            flex-grow: 1;
            border: none;
            background: transparent;
            font-size: 14px;
            outline: none;
            color: var(--text-color);
            -webkit-user-select: text;
            user-select: text;
        }

        .chat-input-row button {
            background: var(--accent-main);
            color: white;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .action-btn {
            color: white;
            border: none;
            padding: 15px;
            border-radius: 18px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: auto;
            width: 100%;
            box-shadow: 0 4px 12px rgba(69, 66, 244, 0.2);
            flex-shrink: 0;
        }

        #qr-modal, #gallery-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            z-index: 3000;
            justify-content: center;
            align-items: center;
            will-change: opacity;
        }
        .qr-content {
            background: rgba(255, 255, 255, 0.55); /* Також на 30% прозоріше */
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 24px;
            border-radius: 24px;
            text-align: center;
            max-width: 240px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .qr-content img { width: 180px; height: 180px; margin-bottom: 12px; border-radius: 16px; }
        .qr-close {
            background: rgba(0, 0, 0, 0.05); border: none; padding: 10px 20px; border-radius: 12px; cursor: pointer; font-weight: 600; width: 100%;
        }

        .gallery-container {
            width: 94%;
            height: 85vh;
            max-width: 450px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            touch-action: none;
        }
        .gallery-img-box {
            width: 100%;
            height: 75vh;
            background-size: cover;
            background-position: center;
            border-radius: 30px;
            box-shadow: 0 24px 48px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
            touch-action: none;
            will-change: transform;
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        .gallery-dots {
            display: flex;
            gap: 6px;
            margin-top: 18px;
        }
        .dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: rgba(255,255,255,0.35);
            transition: background 0.25s ease;
        }
        .dot.active { background: #ffffff; }

        /* ОДНАКОВІ УЛЬТРА-ТОНКІ РАМКИ ТА СПІЛЬНИЙ СТИЛЬ ДЛЯ МАРКЕРІВ */
        .custom-avatar-marker, .custom-place-marker { 
            background: none !important; 
            border: none !important; 
            box-shadow: none !important;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.15)) !important;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* Зменшені однакові рамки (38px x 38px) з однаковим кольором і тонким бордером (в 2 рази менше) */
        .avatar-ring {
            width: 38px; 
            height: 38px; 
            border-radius: 50%;
            background: var(--ultramarine-gradient); /* Jednakowy ультрамариновий градієнт */
            padding: 1.2px; /* Рамку зменшено рівно в 2 рази, ідеально симетрична з усіх боків */
            box-sizing: border-box;
        }
        .avatar-ring-inner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background-size: cover;
            background-position: center;
        }
        
        /* Тонка рівномірна рамка для закладів */
        .place-ring {
            width: 38px; 
            height: 38px; 
            border-radius: 50%;
            background: var(--ultramarine-gradient); 
            padding: 1.2px; /* Рівномірна рамка в 1.2px зі всіх боків */
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .place-icon-svg {
            width: 18px; /* Відповідно зменшена іконка для балансу */
            height: 18px;
            fill: #ffffff;
            display: block;
        }
    </style>
</head>
<body>

    <div id="app-container">
        <div id="map"></div>

        <div class="apple-zoom-slider-container" id="zoom-slider-container">
            <div class="apple-zoom-track" id="zoom-track">
                <div class="apple-zoom-handle" id="zoom-handle"></div>
            </div>
        </div>

        <div id="profile-sidebar">
            <div class="drag-handle"></div>
            <div class="profile-hero" id="prof-img">
                <span class="badge" id="prof-badge" style="display:none;">АКЦІЯ</span>
            </div>
            <div class="profile-info" id="prof-non-active-info">
                <h2 class="profile-name" id="prof-name">Назва</h2>
                <p class="profile-status" id="prof-status">"Статус"</p>
                
                <div class="info-scroll-area">
                    <div class="profile-section">
                        <label id="label-1">Опис</label>
                        <div id="prof-text1-box"><p id="prof-text1">...</p></div>
                    </div>

                    <div class="profile-section">
                        <label id="label-2">Деталі</label>
                        <div id="prof-text2-box"><p id="prof-text2">...</p></div>
                    </div>
                </div>

                <div id="chat-container">
                    <ul id="chat-messages"></ul>
                    <div class="chat-input-row">
                        <input type="text" id="chat-msg-input" placeholder="Повідомлення" />
                        <button id="chat-send-btn">▲</button>
                    </div>
                </div>

                <button class="action-btn" id="prof-btn">Дія</button>
            </div>
        </div>
    </div>

    <div id="qr-modal">
        <div class="qr-content">
            <h3>Твій купон</h3>
            <div id="qr-code-space"></div>
            <p style="font-size: 12px; color: var(--text-secondary); margin-bottom: 16px;">Покажи цей код на касі закладу</p>
            <button class="qr-close" onclick="closeQr()">Готово</button>
        </div>
    </div>

    <div id="gallery-modal">
        <div class="gallery-container">
            <div class="gallery-img-box" id="gallery-img"></div>
            <div class="gallery-dots" id="gallery-dots"></div>
        </div>
    </div>
