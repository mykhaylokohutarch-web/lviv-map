<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Львів Спілкується та Смакує</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg-color: #f4f4f7;
            --card-bg: #ffffff;
            --accent-people: #ff4757;
            --accent-place: #6c5ce7;
            --text-color: #2d3436;
            --text-secondary: #636e72;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
        }

        #app-container {
            display: flex;
            width: 100%;
            height: 100vh;
            position: relative;
        }

        #map {
            flex-grow: 1;
            height: 100%;
            background-color: #e5e9f0;
        }

        /* Стильний універсальний сайдбар */
        #profile-sidebar {
            width: 360px;
            background-color: var(--card-bg);
            height: 100%;
            box-shadow: -5px 0 25px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
            position: absolute;
            right: 0;
            top: 0;
            z-index: 1000;
            transform: translateX(100%);
        }

        #profile-sidebar.active {
            transform: translateX(0);
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(255,255,255,0.9);
            border: none;
            color: #2d3436;
            font-size: 24px;
            cursor: pointer;
            z-index: 10;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
        }

        .profile-hero {
            position: relative;
            height: 220px;
            background-size: cover;
            background-position: center;
        }

        .badge {
            position: absolute;
            bottom: 15px;
            right: 15px;
            padding: 5px 12px;
            background: var(--accent-place);
            color: white;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .profile-info {
            padding: 25px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            overflow-y: auto;
        }

        .profile-name {
            font-size: 22px;
            margin: 0 0 5px 0;
            font-weight: 600;
        }

        .profile-status {
            font-style: italic;
            margin: 0 0 20px 0;
            font-size: 15px;
            font-weight: 500;
        }
        .status-people { color: var(--accent-people); }
        .status-place { color: var(--accent-place); }

        .profile-section {
            margin-bottom: 20px;
        }

        .profile-section label {
            display: block;
            color: var(--text-secondary);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .profile-section p {
            margin: 0;
            font-size: 14px;
            line-height: 1.45;
            color: #4a4a4a;
        }

        .action-btn {
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: auto;
            transition: opacity 0.2s, transform 0.1s;
        }
        
        .action-btn:active { transform: scale(0.98); }

        /* --- СТИЛІ ІНТЕГРОВАНОГО ЧАТУ --- */
        #chat-box {
            display: none;
            flex-direction: column;
            height: 250px;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-top: 15px;
            background: #fafafa;
        }

        #chat-messages {
            flex-grow: 1;
            overflow-y: auto;
            padding: 10px;
            list-style: none;
            margin: 0;
        }

        #chat-messages li {
            margin-bottom: 8px;
            padding: 6px 10px;
            background: white;
            border-radius: 6px;
            font-size: 13px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            line-height: 1.4;
        }

        #chat-input-form {
            display: flex;
            padding: 5px;
            background: #eee;
            border-bottom-left-radius: 7px;
            border-bottom-right-radius: 7px;
        }

        #chat-input-form input {
            flex-grow: 1;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            outline: none;
            font-size: 13px;
        }

        #chat-input-form button {
            background: var(--accent-people);
            color: white;
            border: none;
            padding: 8px 12px;
            margin-left: 5px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }

        /* Маркери Людей */
        .custom-avatar-marker { background: none; border: none; }
        .avatar-ring {
            width: 42px; height: 42px; border-radius: 50%;
            border: 3px solid var(--accent-people);
            box-shadow: 0 3px 10px rgba(255, 71, 87, 0.5);
            background-size: cover; background-position: center;
            transition: transform 0.2s;
        }
        .avatar-ring:hover { transform: scale(1.15); }

        /* Маркери Закладів (Реклама) */
        .custom-place-marker { background: none; border: none; }
        .place-ring {
            width: 36px; height: 36px; border-radius: 50%;
            background-color: var(--accent-place);
            border: 2px solid white;
            box-shadow: 0 3px 10px rgba(108, 92, 231, 0.6);
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; color: white; cursor: pointer;
            transition: transform 0.2s;
        }
        .place-ring:hover { transform: scale(1.2); background-color: #5b4bc4; }
    </style>
</head>

            { type: 'place', name: "Найдорожча ресторація Галичини (Масони)", coords: [49.8409, 24.0318], photo: "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=500", status: "Таємне товариство з великими знижками 🗲🔺", text1: "пл. Ринок, 14. Секретні двері через звичайну квартиру. Спочатку ціни шокують, але діє знижка 90% для місцевих.", text2: "З цим додатком знижка 90% на все меню автоматично активується без наявності фізичної карти 'Lokal'!", icon: "🍽️" },
            { type: 'place', name: "Na Bambetli (На Бамбетлі)", coords: [49.8419, 24.0333], photo: "https://images.unsplash.com/photo-1554118811-1e0d58224f24?w=500", status: "Затишна кав'ярня у пасажі Андреоллі 🕰️", text1: "пл. Ринок, 29. Справжня львівська класика, старовинні дивани-бамбетлі, кава в турках і спокійна атмосфера старого Львова.", text2: "Знижка 15% на всі вида домашніх чаїв та глінтвейнів у вечірній час після 20:00.", icon: "☕" },
            { type: 'place', name: "Трапезна Ідей", coords: [49.8408, 24.0348], photo: "https://images.unsplash.com/photo-1002301197179-6522b4b0004d?w=500", status: "Галицька кухня в монастирських підземеллях 🏰", text1: "вул. Валова, 18а. Автентичний ресторан у підвалах Бернардинського монастиря. Фірмовий монастирський борщ.", text2: "Пригощаємо фірмовим пирогом з цибулею при замовленні будь-якої гарячої першої страви.", icon: "🍽️" },
            { type: 'place', name: "Аптека Міколяша", coords: [49.8398, 24.0302], photo: "https://images.unsplash.com/photo-1508739773434-c26b3d09e071?w=500", status: "Кафе-музей на місці історичної аптеки 💊🍰", text1: "вул. Коперника, 1. Величезний вибір тістечок, які схожі на витвори мистецтва, власна кондитерська лабораторія.", text2: "Отримай фірмовий аптечний трав'яний еліксир здоров'я безкоштовно до будь-якого десерту.", icon: "🍰" },
            { type: 'place', name: "The Cheese Bakery", coords: [49.8405, 24.0323], photo: "https://images.unsplash.com/photo-1551024601-bec78aea704b?w=500", status: "Найкращі чізкейки у вашому житті 🧀🍰", text1: "вул. Галицька, 1. Неймовірно естетичний інтер'єр, смачні бранчі (авокадо тости) та десятки видів ніжного сирного торта.", text2: "Акція: При покупці шматочка чізкейку 'Солена карамель' — класичне еспресо або американо за 10 грн.", icon: "🍰" },
            { type: 'place', name: "Вiденська кав'ярня", coords: [49.8428, 24.0280], photo: "https://images.unsplash.com/photo-1559925393-8be0ec4767c8?w=500", status: "Найстаріша діюча кав'ярня Львова (1829 р.) 🎻", text1: "просп. Свободи, 12. Традиційний австрійський стиль, жива класична музика вечорами, витончені віденські шніцелі.", text2: "Даруємо штрудель з яблуками до будь-якої великої м'ясної вечері за цим рекламним купоном.", icon: "☕" },
            { type: 'place', name: "Кафе GREEN", coords: [49.8385, 24.0315], photo: "https://images.unsplash.com/photo-1512621776951-a57141f2eefd?w=500", status: "Територія смачної вегетаріанської їжі 🍃🥕", text1: "вул. Братів Рогатинців, 5. Рослинна кухня, веганські бургери, сироїдні десерти без цукру та глютену.", text2: "Спеціальна знижка 15% на весь асортимент суперфудів та еко-товарів на нашому міні-маркеті.", icon: "🍃" }
        ];

        let currentActiveItem = null;

        // Показуємо Людей
        people.forEach(person => {
            const customIcon = L.divIcon({
                className: 'custom-avatar-marker',
                html: `<div class="avatar-ring" style="background-image: url('${person.avatar}')"></div>`,
                iconSize: [42, 42], iconAnchor: [21, 21]
            });
            const marker = L.marker(person.coords, { icon: customIcon }).addTo(map);
            marker.on('click', () => showSidebar(person));
        });

        // Показуємо Заклади
        places.forEach(place => {
            const customIcon = L.divIcon({
                className: 'custom-place-marker',
                html: `<div class="place-ring">${place.icon}</div>`,
                iconSize: [36, 36], iconAnchor: [18, 18]
            });
            const marker = L.marker(place.coords, { icon: customIcon }).addTo(map);
            marker.on('click', () => showSidebar(place));
        });

        // Функція для показу Сайдбару та завантаження повідомлень чату
        window.showSidebar = function(item) {
            currentActiveItem = item;
            
            document.getElementById('prof-img').style.backgroundImage = `url('${item.photo}')`;
            document.getElementById('prof-name').innerText = item.name;
            document.getElementById('prof-status').innerText = `"${item.status}"`;
            document.getElementById('prof-text1').innerText = item.about || item.text1;
            document.getElementById('prof-text2').innerText = item.interests || item.text2;

            const badge = document.getElementById('prof-badge');
            const statusEl = document.getElementById('prof-status');
            const btn = document.getElementById('prof-btn');
            const label1 = document.getElementById('label-1');
            const label2 = document.getElementById('label-2');
            const chatBox = document.getElementById('chat-box');

            if (item.type === 'person') {
                badge.style.display = 'none';
                statusEl.className = "profile-status status-people";
                label1.innerText = "Про себе";
                label2.innerText = "Інтереси";
                btn.innerText = "Надіслати повідомлення";
                btn.style.backgroundColor = "var(--accent-people)";
                btn.style.display = "block";
                chatBox.style.display = "none"; // Спочатку ховаємо чат, поки не натиснуть кнопку
            } else {
                badge.style.display = 'block';
                statusEl.className = "profile-status status-place";
                label1.innerText = "Про заклад та адресу";
                label2.innerText = "🔥 Гаряча акція для вас";
                btn.innerText = "Забронювати столик / Отримати знижку";
                btn.style.backgroundColor = "var(--accent-place)";
                btn.style.display = "block";
                chatBox.style.display = "none";
            }

            document.getElementById('profile-sidebar').classList.add('active');
            map.panTo([item.coords[0], item.coords[1] + 0.0035]);
        };

        window.closeProfile = function() {
            document.getElementById('profile-sidebar').classList.remove('active');
            currentActiveItem = null;
        };

        // Обробка головної дії (кліку по кнопці в сайдбарі)
        window.handleAction = function() {
            if (!currentActiveItem) return;
            if (currentActiveItem.type === 'person') {
                // Замість алерта — відкриваємо блок чату
                document.getElementById('chat-box').style.display = "flex";
                document.getElementById('prof-btn').style.display = "none"; // Ховаємо велику кнопку
                loadChatMessages(currentActiveItem.id);
            } else {
                alert(`Ваш купон на знижку в "${currentActiveItem.name}" активовано! Покажіть цей екран офіціанту.`);
            }
        };

        // --- ЛОГІКА СИНХРОНІЗАЦІЇ ЧАТУ З FIREBASE ---
        const chatForm = document.getElementById('chat-input-form');
        const messageInput = document.getElementById('chat-msg-input');
        const messagesList = document.getElementById('chat-messages');
        let currentChatId = null;

        function loadChatMessages(userId) {
            currentChatId = userId;
            messagesList.innerHTML = ""; // Очищаємо екран перед завантаженням

            // Слухаємо гілку повідомлень конкретної людини у Firebase
            onChildAdded(ref(db, `chats/${userId}`), (snapshot) => {
                // Перевіряємо, чи ми досі в чаті з цією людиною
                if (currentChatId !== userId) return;
                
                const msg = snapshot.val();
                const li = document.createElement('li');
                li.innerHTML = `<strong>${msg.user}:</strong> ${msg.text}`;
                messagesList.appendChild(li);
                messagesList.scrollTop = messagesList.scrollHeight;
            });
        }

        // Відправка повідомлення в базу
        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = messageInput.value.trim();
            if (text !== "" && currentChatId) {
                push(ref(db, `chats/${currentChatId}`), {
                    user: myName,
                    text: text,
                    timestamp: Date.now()
                });
                messageInput.value = "";
            }
        });
    </script>
</body>
</html>
